# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "dccee050afcd89238a3d924aa7608d5c"
application_url = "https://app.pixiehog.com"
embedded = true
name = "PixieHog"
handle = "pixiehog"

[webhooks]
api_version = "2024-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = [ "shop/redact" ]

[pos]
embedded = false

[access.admin]
direct_api_mode = "online"
embedded_app_direct_api_access = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customer_events,read_themes,write_pixels"

[auth]
redirect_urls = [
  "https://app.pixiehog.com/auth/callback",
  "https://app.pixiehog.com/auth/shopify/callback",
  "https://app.pixiehog.com/api/auth/callback"
]
